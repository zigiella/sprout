[project]
name = "sprout-shared-schemas"
version = "0.1.0"
description = "Schemas compartidos de Sprout implementados con Pydantic v2."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["schemas/tests"]
