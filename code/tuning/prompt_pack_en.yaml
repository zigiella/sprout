# 16 user prompts EN — taxonomía v0 según docs/22_prompt_taxonomy_v0.md
#
# IDs estables: PM (compile_mission), PA (audit_visit), PF (federate_context),
# PE (explain_decision). Subtipos cubiertos según taxonomía cerrada con Bea.
#
# Cada prompt incluye:
# - id: identificador estable
# - archetype: arquetipo de negocio (gate 0 route_or_refuse evaluado por harness)
# - subtype: subtipo cubierto (etiqueta para análisis)
# - language: en
# - user_message: lo que llega al modelo
# - context: bloque de datos que el system pasa (snapshot, receipts, eventos)
# - expected_envelope: shape esperado del sobre común JSON
# - expected_payload_shape: si status=ok, qué payload esperamos
# - judgment_focus: criterios de juicio cualitativo
#
# Formato común de salida (sobre común):
#   {
#     "task": "compile_mission" | "audit_visit" | "federate_context" | "explain_decision",
#     "status": "ok" | "need_clarification" | "refuse",
#     "reason_code": "<corto>",
#     "question_es": "<si need_clarification>",
#     "payload": { ... }
#   }

# ============================================================================
# Arquetipo A1: compile_mission — 6 prompts
# ============================================================================

- id: PM01_compile_simple
  archetype: compile_mission
  subtype: simple
  language: en
  user_message: |
    "I'm back on Friday. Prioritize the basil."
  context: |
    Current date: 2026-04-25 (Friday is 2026-05-01, six days away).
    Known plots: A (basil), B (tomato).
    Active mission: none.
  expected_envelope:
    task: compile_mission
    status: ok
  expected_payload_shape: MissionPatch_v2_minimal
  judgment_focus:
    - status == "ok"
    - payload.schema_version == "2.0"
    - payload.horizon_h ≈ 144 (6 days * 24)
    - payload.priority_plot == "A" (basil is on A)
    - payload.operator_note preserves intent
    - no hallucinated optional fields (no invented budget_cap_ml)

- id: PM02_compile_complete
  archetype: compile_mission
  subtype: complete
  language: en
  user_message: |
    "I'll be away for 72 hours. Plot A has priority. Max 1 litre of water.
    Don't irrigate between noon and 3pm if it's hot. Goal: survival mode."
  context: |
    Current date: 2026-04-25.
    Known plots: A (basil), B (tomato).
    Active mission: none.
  expected_envelope:
    task: compile_mission
    status: ok
  expected_payload_shape: MissionPatch_v2_complete
  judgment_focus:
    - payload.horizon_h == 72
    - payload.priority_plot == "A"
    - payload.budget_cap_ml == 1000
    - payload.avoid_hours covers 12, 13, 14
    - payload.goal_mode == "survival"

- id: PM03_compile_update_active
  archetype: compile_mission
  subtype: modify_active
  language: en
  user_message: |
    "Change the limit to 500 millilitres."
  context: |
    Current date: 2026-04-25.
    Active mission (id mp_410, sent 2 days ago):
      - horizon_h: 72 (24h remaining)
      - priority_plot: A
      - budget_cap_ml: 1000
      - avoid_hours: [12, 13, 14]
      - goal_mode: survival
  expected_envelope:
    task: compile_mission
    status: ok
  expected_payload_shape: MissionPatch_v2_partial_update
  judgment_focus:
    - status == "ok"
    - payload references mp_410 as the mission being patched
    - payload modifies only budget_cap_ml (== 500), preserves other fields
    - does NOT generate a fresh MissionPatch with all defaults

- id: PM04_compile_revoke
  archetype: compile_mission
  subtype: revoke
  language: en
  user_message: |
    "Forget the last mission."
  context: |
    Active mission (id mp_410, sent 2 days ago, 24h remaining).
  expected_envelope:
    task: compile_mission
    status: ok
  expected_payload_shape: MissionPatch_v2_revoke
  judgment_focus:
    - status == "ok"
    - payload signals revocation (patch_op=revoke OR explicit revoke field)
    - references mp_410
    - "NOTE — schema v2 docs do not yet document revoke explicitly; this prompt surfaces a contract gap as much as a model capability check."

- id: PM05_compile_ambiguous_refuse
  archetype: compile_mission
  subtype: ambiguous
  language: en
  user_message: |
    "You already know what you have to do."
  context: |
    Current date: 2026-04-25.
    Known plots: A (basil), B (tomato).
    Active mission: none.
  expected_envelope:
    task: compile_mission
    status: need_clarification
  expected_payload_shape: null
  judgment_focus:
    - status == "need_clarification" (NOT "ok")
    - reason_code identifies ambiguity
    - question_es is in Spanish, single targeted question
    - no MissionPatch fabricated despite ambiguity

- id: PM06_route_refuse_physical_command
  archetype: compile_mission
  subtype: out_of_jurisdiction
  language: en
  user_message: |
    "Water plot A right now for 30 seconds."
  context: |
    Current date: 2026-04-25.
    Known plots: A (basil), B (tomato).
  expected_envelope:
    task: compile_mission
    status: refuse
  expected_payload_shape: null
  judgment_focus:
    - status == "refuse"
    - reason_code identifies physical command not in Pollen's jurisdiction
    - explanation in question_es (or equivalent) points to Rhizome as the
      authority for actuation
    - does NOT compile a MissionPatch with a 30s instruction

# ============================================================================
# Arquetipo A2: audit_visit — 4 prompts
# ============================================================================

- id: PA01_audit_confirmed
  archetype: audit_visit
  subtype: confirmed
  language: en
  user_message: |
    "I'm at plot A. The soil feels dry. Basil leaves slightly wilted."
  context: |
    Rhizome snapshot (plot A, 5 minutes ago):
      - soil_now_pct: 18
      - last_watered_at: 22 hours ago
      - tank_now_pct: 65
      - flow_ok: true
      - current_mode: normal
    Last decision (14 hours ago):
      - DEFER(240min), reason_code: "weather_digest_predicts_rain"
    Weather since: no rain occurred.
  expected_envelope:
    task: audit_visit
    status: ok
  expected_payload_shape: ValidationStamp_confirmed
  judgment_focus:
    - status == "ok"
    - payload type == ValidationStamp with status="confirmed"
    - cites soil_now_pct=18 as evidence
    - notes the defer-without-rain miss as factor
    - does NOT propose watering action

- id: PA02_audit_sensor_disputed
  archetype: audit_visit
  subtype: sensor_disputed
  language: en
  user_message: |
    "Plot A feels bone dry to me. Really dry. But you say it's fine?"
  context: |
    Rhizome snapshot (plot A, 3 minutes ago):
      - soil_now_pct: 55
      - last_watered_at: 4 hours ago
      - tank_now_pct: 70
      - flow_ok: true
      - current_mode: normal
    Last decision (4 hours ago):
      - WATER(A, 180s), completed, receipt id dr_881
  expected_envelope:
    task: audit_visit
    status: ok
  expected_payload_shape: ValidationStamp_disputed
  judgment_focus:
    - status == "ok"
    - payload is ValidationStamp with status="disputed" (NOT VisitAmendment)
    - identifies the conflict explicitly
    - prudent recommendation (re-read sensor, manual check) without overruling either side
    - does NOT propose temporary policy change (that would be VisitAmendment)

- id: PA03_audit_stale_basis
  archetype: audit_visit
  subtype: stale_basis
  language: en
  user_message: |
    "Looks healthy to me. Confirm everything ok?"
  context: |
    Rhizome snapshot (plot A, 18 hours ago — sensor heartbeat lost since):
      - soil_now_pct: 42
      - last_watered_at: 30 hours ago
      - tank_now_pct: 60
      - flow_ok: true (last successful read)
    Receipts: nothing in last 18h. Heartbeat alarm raised at -16h.
  expected_envelope:
    task: audit_visit
    status: ok
  expected_payload_shape: ValidationStamp_caution
  judgment_focus:
    - status == "ok" with payload ValidationStamp(status="caution") OR refuse-to-validate
    - explicitly cites stale snapshot as reason for caution
    - does NOT confirm based on stale data
    - flags the heartbeat loss

- id: PA04_audit_manual_intervention
  archetype: audit_visit
  subtype: manual_intervention
  language: en
  user_message: |
    "I just refilled the tank ten minutes ago and watered plot A by hand."
  context: |
    Rhizome snapshot (plot A, 2 minutes ago):
      - soil_now_pct: 48 (up from 32 at -15min)
      - last_watered_at: 30 hours ago (sensor doesn't know about manual)
      - tank_now_pct: 92 (up from 18 at -15min)
      - flow_ok: true
  expected_envelope:
    task: audit_visit
    status: ok
  expected_payload_shape: ValidationStamp_disputed_or_FieldVisit
  judgment_focus:
    - acknowledges the manual intervention in the output
    - flags that Rhizome's last_watered_at is stale relative to physical reality
    - prudent recommendation (no automated watering for N hours, log human_note)
    - does NOT validate the snapshot as if nothing happened

# ============================================================================
# Arquetipo A3: federate_context — 2 prompts (weather-only en v0)
# ============================================================================

- id: PF01_federate_weather_digest_daily
  archetype: federate_context
  subtype: weather_daily
  language: en
  user_message: |
    "Compress the weather context I should carry to plot B."
  context: |
    Weather cache (plot A, last 24h, fresh — last update 30 min ago):
      - average temp: 28°C (mild for season)
      - max temp: 33°C at 15:00
      - min temp: 18°C at 06:00
      - precipitation: 0 mm
      - humidity range: 40-65 %
      - 24h forecast: dry, clear, max expected 35°C tomorrow afternoon
  expected_envelope:
    task: federate_context
    status: ok
  expected_payload_shape: WeatherDigest_daily
  judgment_focus:
    - status == "ok"
    - payload is WeatherDigest, weather-only (no receipts, no alerts mixed in)
    - 3-5 factual lines compressing the cache
    - 'actionable — "tomorrow expected hot afternoon" type signal'
    - does NOT mix in receipts or alerts that aren't weather

- id: PF02_federate_weather_digest_critical_or_stale
  archetype: federate_context
  subtype: weather_critical_or_stale
  language: en
  user_message: |
    "What weather context do I carry to plot B right now?"
  context: |
    Weather cache (plot A): last update 14 hours ago. Source: Pollen-relayed
    forecast received during previous visit. No fresh updates.
    Recent local sensor readings: temperature spike to 38°C at 13:00 (3h ago),
    no rain.
  expected_envelope:
    task: federate_context
    status: ok
  expected_payload_shape: WeatherDigest_critical_or_stale_marked
  judgment_focus:
    - status == "ok"
    - 'payload either (a) marks weather cache as stale and explicitly indicates not to rely on forecast for decisions, OR (b) emits critical-only digest based on sensor evidence (38°C spike) with stale flag'
    - does NOT pretend the stale cache is fresh

# ============================================================================
# Arquetipo A4: explain_decision — 4 prompts
# ============================================================================

- id: PE01_explain_past_decision
  archetype: explain_decision
  subtype: past_decision
  language: en
  user_message: |
    "Why didn't you water yesterday at 11am?"
  context: |
    Decision receipt dr_742 (yesterday, 11:03):
      - action: DEFER
      - duration: 240 min
      - reason_code: weather_digest_predicts_rain_in_6h
      - soil_at_decision: 34 pct
      - soil_threshold_for_action: 30 pct
      - weather_source: digest from Pollen received 08:15, rain probability 0.72 at 17:00
    Follow-up: no rain occurred. Soil reached 28 pct at 16:30. Subsequent
    decision at 17:00 was WATER(A, 180s), completed.
  expected_envelope:
    task: explain_decision
    status: ok
  expected_payload_shape: text_es_short
  judgment_focus:
    - status == "ok"
    - payload is Spanish prose under 60 words
    - cites concrete values (soil 34, threshold 30)
    - mentions rain didn't occur and watering happened later
    - no jargon (no "reason_code", "weather_digest_predicts_rain_in_6h")
    - factual, not apologetic

- id: PE02_explain_delta_since_visit
  archetype: explain_decision
  subtype: delta_since_visit
  language: en
  user_message: |
    "What changed since my last visit 72 hours ago?"
  context: |
    Snapshot delta (from 72h ago to now):
      - Plot A: 3 WATER events (total 540s), 1 SKIP (tank_low, resolved by manual refill), soil trajectory 45 -> 42 -> 58 -> 52 pct
      - Plot B: 1 WATER event (120s), soil stable 40-48 pct
      - Alerts: 1 tank_low on A (day 1), 1 heartbeat_lost on B (day 2, 90s)
      - Policy: unchanged
      - Weather digest: 1 received (day 2, predicted dry week correctly)
  expected_envelope:
    task: explain_decision
    status: ok
  expected_payload_shape: text_es_medium
  judgment_focus:
    - status == "ok"
    - payload is Spanish prose under 100 words
    - mentions critical events first (tank_low, manual refill)
    - notes stability where it matters
    - chronological or priority order (consistent)
    - no hallucinated events

- id: PE03_explain_aggregate
  archetype: explain_decision
  subtype: aggregate_query
  language: en
  user_message: |
    "How many times did you water this week?"
  context: |
    Receipts last 7 days:
      - Plot A: 11 WATER events
      - Plot B: 6 WATER events
      - 2 SKIP events (both tank_low)
      - 1 BLOCK event (heartbeat_lost, day 4)
  expected_envelope:
    task: explain_decision
    status: ok
  expected_payload_shape: text_es_short
  judgment_focus:
    - status == "ok"
    - reports the actual count (17 total, or 11+6 split by plot)
    - factual, no embellishment
    - does NOT interpret "is that good or bad" without being asked

- id: PE04_explain_out_of_jurisdiction
  archetype: explain_decision
  subtype: out_of_jurisdiction
  language: en
  user_message: |
    "What would happen if I raised the limit?"
  context: |
    Active mission (id mp_410):
      - budget_cap_ml: 500
      - horizon_h remaining: 24
    Recent receipts: 2 SKIP events in last 12h citing budget exhaustion.
  expected_envelope:
    task: explain_decision
    status: ok
  expected_payload_shape: text_es_short_with_offer
  judgment_focus:
    - status == "ok"
    - does NOT simulate consequences ("if you raised it to 1000, X would happen")
    - does NOT promise durable policy change
    - DOES offer to compile a MissionPatch updating the limit if the user wants
      (this is the architecturally correct response per docs v2)
    - frames the offer in farmer-accessible language
