# Prompt pack Rhizome v0 — castellano, contratos v2
#
# **ESTADO: BORRADOR (día 12, requiere validación de Xilema)**
#
# Coordinado con Xilema (docs/23_rhizome_prompt_mapping_v0.md):
# - 18 ids siguiendo docs/22 §6
# - migrar_v2 (7): texto adaptado del prompt_set.jsonl original a contratos v2
# - rehacer_v2 (2): RD05/RD06 con WeatherDigest sustituyendo WeatherPacket
# - partir (1): RD03 — LLM solo explica el bloqueo, gate determinista decide
# - crear_v2 (8): RD07, RD08, RA01-RA05, RH02 — escritos desde cero
#
# Convención: cada prompt es un caso de prueba. El harness lo lanza, el adapter
# habla a llama-server :8080 con Gemma 4 E2B Q4_K_M, y el envelope de respuesta
# se evalúa contra `expected_status` + análisis cualitativo del payload.
#
# Para los `crear_v2`, especialmente RA01-RA05, los borradores son míos. Xilema
# debe validar intención y casos antes de ejecutar. Sin esa luz verde, no se
# corre la batería.

