<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 480" font-family="Manrope, system-ui, sans-serif" role="img" aria-label="Sprout local dual-agent pattern · a second voice without authority">
  <title>A second voice without authority.</title>
  <desc>Sprout local dual-agent pattern. A state bundle (telemetry, policy, TTL) is ingested by two local agents in parallel. The Operational steward decides inside the safe envelope and emits a DecisionReceipt with action and rationale. The ShadowSkeptic objects without authority and writes a Disagreement log with affects_decision=false. Disagreement becomes data, not action; proven recurring objections can later be promoted into deterministic gates.</desc>

  <defs>
    <marker id="dag-tip-light" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 z" fill="rgba(243,237,228,0.75)"></path>
    </marker>
    <marker id="dag-tip-dim" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 z" fill="rgba(243,237,228,0.55)"></path>
    </marker>
  </defs>


  <rect width="1180" height="480" fill="#3a3733"></rect>


  <text x="32" y="46" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="500" letter-spacing="2.4" fill="#C5F26B">SAFETY EVIDENCE · DUAL AGENT</text>
  <text x="32" y="84" font-size="26" font-weight="700" letter-spacing="-0.5" fill="#F3EDE4">A second voice without authority.</text>


  <g font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" font-weight="500" letter-spacing="2.2">
    <line x1="32" y1="120" x2="272" y2="120" stroke="rgba(243,237,228,0.22)" stroke-width="1"></line>
    <text x="32" y="111" fill="rgba(243,237,228,0.62)">INPUT · STATE</text>

    <line x1="304" y1="120" x2="574" y2="120" stroke="rgba(243,237,228,0.22)" stroke-width="1"></line>
    <text x="304" y="111" fill="rgba(243,237,228,0.62)">AUTHORITY · LOCAL</text>
    <text x="574" y="111" text-anchor="end" fill="rgba(243,237,228,0.42)">PARALLEL</text>

    <line x1="606" y1="120" x2="876" y2="120" stroke="rgba(243,237,228,0.22)" stroke-width="1"></line>
    <text x="606" y="111" fill="rgba(243,237,228,0.62)">ARTIFACTS · LOCAL</text>
    <text x="876" y="111" text-anchor="end" fill="rgba(243,237,228,0.42)">SIGNED</text>
  </g>


  <g transform="translate(32,140)">
    <rect width="240" height="240" rx="3" fill="#F3EDE4" stroke="#CDBBAA" stroke-width="1"></rect>
    <text x="20" y="32" font-family="IBM Plex Mono, Menlo, monospace" font-size="10" font-weight="500" letter-spacing="2.2" fill="#8A654B">01 · INPUT</text>
    <text x="20" y="60" font-size="18" font-weight="700" letter-spacing="-0.2" fill="#1A1A18">State bundle</text>
    <text x="20" y="92" font-size="12.5" font-weight="500" fill="#2A221D">telemetry</text>
    <text x="20" y="112" font-size="12.5" font-weight="500" fill="#2A221D">active policy</text>
    <text x="20" y="132" font-size="12.5" font-weight="500" fill="#2A221D">TTL</text>
    <text x="20" y="152" font-size="12.5" font-weight="500" fill="#2A221D">cooldown</text>
    <text x="20" y="172" font-size="12.5" font-weight="500" fill="#2A221D">safety state</text>
    <line x1="20" y1="194" x2="220" y2="194" stroke="#CDBBAA" stroke-width="1"></line>
    <text x="20" y="214" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="0.6" fill="#8A654B">Ingested by both</text>
  </g>


  <g transform="translate(304,140)">
    <rect width="270" height="110" rx="3" fill="#1A1A18" stroke="rgba(243,237,228,0.10)" stroke-width="1"></rect>
    <circle cx="254" cy="16" r="4" fill="#C5F26B"></circle>
    <circle cx="254" cy="16" r="9" fill="none" stroke="#C5F26B" stroke-width="1" opacity="0.32"></circle>
    <text x="20" y="32" font-family="IBM Plex Mono, Menlo, monospace" font-size="10" font-weight="500" letter-spacing="2.2" fill="rgba(243,237,228,0.55)">02 · OPERATIONAL</text>
    <text x="20" y="58" font-size="17" font-weight="700" letter-spacing="-0.2" fill="#F3EDE4">Steward</text>
    <text x="20" y="80" font-size="12.5" font-weight="500" fill="rgba(243,237,228,0.78)">Decides inside the safe envelope.</text>
    <line x1="20" y1="92" x2="250" y2="92" stroke="rgba(243,237,228,0.18)" stroke-width="1"></line>
    <text x="20" y="106" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="0.6" fill="#C5F26B">Authorizes · final action</text>
  </g>


  <g transform="translate(304,270)">
    <rect width="270" height="110" rx="3" fill="#1A1A18" stroke="rgba(243,237,228,0.10)" stroke-width="1"></rect>
    <circle cx="254" cy="16" r="4" fill="#C5F26B"></circle>
    <circle cx="254" cy="16" r="9" fill="none" stroke="#C5F26B" stroke-width="1" opacity="0.32"></circle>
    <text x="20" y="32" font-family="IBM Plex Mono, Menlo, monospace" font-size="10" font-weight="500" letter-spacing="2.2" fill="rgba(243,237,228,0.55)">02 · SHADOW</text>
    <text x="20" y="58" font-size="17" font-weight="700" letter-spacing="-0.2" fill="#F3EDE4">ShadowSkeptic</text>
    <text x="20" y="80" font-size="12.5" font-weight="500" fill="rgba(243,237,228,0.78)">Objects without authority.</text>
    <line x1="20" y1="92" x2="250" y2="92" stroke="rgba(243,237,228,0.18)" stroke-width="1"></line>
    <text x="20" y="106" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="0.6" fill="rgba(243,237,228,0.62)">Observes · no actuation</text>
  </g>


  <g transform="translate(606,140)">
    <rect width="270" height="110" rx="3" fill="#F3EDE4" stroke="#CDBBAA" stroke-width="1"></rect>
    <text x="20" y="32" font-family="IBM Plex Mono, Menlo, monospace" font-size="10" font-weight="500" letter-spacing="2.2" fill="#8A654B">03 · OUTCOME</text>
    <text x="20" y="58" font-size="17" font-weight="700" letter-spacing="-0.2" fill="#1A1A18">DecisionReceipt</text>
    <text x="20" y="80" font-size="12.5" font-weight="500" fill="#2A221D">action + rationale</text>
    <line x1="20" y1="92" x2="250" y2="92" stroke="#CDBBAA" stroke-width="1"></line>
    <text x="20" y="106" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="0.6" fill="#8A654B">Final → valve</text>
  </g>


  <g transform="translate(606,270)">
    <rect width="270" height="110" rx="3" fill="#F3EDE4" stroke="#CDBBAA" stroke-width="1"></rect>
    <text x="20" y="32" font-family="IBM Plex Mono, Menlo, monospace" font-size="10" font-weight="500" letter-spacing="2.2" fill="#8A654B">03 · EVIDENCE</text>
    <text x="20" y="58" font-size="17" font-weight="700" letter-spacing="-0.2" fill="#1A1A18">Disagreement log</text>
    <text x="20" y="80" font-size="12.5" font-weight="500" fill="#2A221D"><tspan font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5">affects_decision = false</tspan></text>
    <line x1="20" y1="92" x2="250" y2="92" stroke="#CDBBAA" stroke-width="1"></line>
    <text x="20" y="106" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="0.6" fill="#8A654B">Promotable to rule</text>
  </g>



  <path d="M 272 195 L 304 195" fill="none" stroke="rgba(243,237,228,0.62)" stroke-width="1.4" marker-end="url(#dag-tip-light)"></path>
  <text x="288" y="186" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="9.5" font-weight="500" letter-spacing="0.4" fill="rgba(243,237,228,0.72)">in</text>

  <path d="M 272 325 L 304 325" fill="none" stroke="rgba(243,237,228,0.62)" stroke-width="1.4" marker-end="url(#dag-tip-light)"></path>
  <text x="288" y="316" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="9.5" font-weight="500" letter-spacing="0.4" fill="rgba(243,237,228,0.72)">in</text>



  <path d="M 574 195 L 606 195" fill="none" stroke="rgba(243,237,228,0.62)" stroke-width="1.4" marker-end="url(#dag-tip-light)"></path>
  <text x="590" y="186" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="9.5" font-weight="500" letter-spacing="0.4" fill="rgba(243,237,228,0.82)">ACK</text>

  <path d="M 574 325 L 606 325" fill="none" stroke="rgba(243,237,228,0.55)" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#dag-tip-dim)"></path>
  <text x="590" y="316" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="9.5" font-weight="500" letter-spacing="0.4" fill="rgba(243,237,228,0.72)">log</text>


  <g transform="translate(34,408)">
    <line x1="0" y1="0" x2="1116" y2="0" stroke="rgba(243,237,228,0.22)" stroke-width="1"></line>

    <text x="0" y="22" font-family="IBM Plex Mono, Menlo, monospace" font-size="10" font-weight="500" letter-spacing="2.2" fill="rgba(243,237,228,0.55)">INVARIANT</text>
    <text x="0" y="46" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" font-weight="500" letter-spacing="0.4" fill="rgba(243,237,228,0.78)">
      <tspan>Disagreement becomes data, not action.</tspan>
      <tspan dx="10" fill="rgba(243,237,228,0.40)">·</tspan>
      <tspan dx="10" fill="#C5F26B" font-weight="600">Even skepticism has jurisdiction.</tspan>
    </text>


    <g transform="translate(740,18)" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" font-weight="500" letter-spacing="0.4">

      <rect x="0" y="0" width="12" height="12" fill="#1A1A18" stroke="rgba(243,237,228,0.20)"></rect>
      <circle cx="9" cy="3" r="2" fill="#C5F26B"></circle>
      <text x="22" y="10" fill="rgba(243,237,228,0.78)">AI present</text>


      <rect x="120" y="0" width="12" height="12" fill="#F3EDE4" stroke="#CDBBAA"></rect>
      <text x="142" y="10" fill="rgba(243,237,228,0.78)">deterministic</text>


      <g transform="translate(0,30)">
        <line x1="0" y1="6" x2="24" y2="6" stroke="rgba(243,237,228,0.62)" stroke-width="1.4" marker-end="url(#dag-tip-light)"></line>
        <text x="32" y="10" fill="rgba(243,237,228,0.78)">authoritative</text>
        <line x1="120" y1="6" x2="144" y2="6" stroke="rgba(243,237,228,0.55)" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#dag-tip-dim)"></line>
        <text x="152" y="10" fill="rgba(243,237,228,0.78)">observational</text>
      </g>
    </g>
  </g>
</svg>
